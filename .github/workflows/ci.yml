# sh19 diagnostic (never to merge): #34's probes on the CI hosts: what
# each shape pelt runs in-process does, and what a pelt process holds
# (threads, descriptors) that a forked child would inherit.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macdiag:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: tools/fetch-toolchain
      - run: tools/build --all
      - name: the shapes
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for t in native release; do
            TMPDIR="$RUNNER_TEMP" bash notes/sh19-evidence/probe/shapes/run.sh "$PWD/target/$t/pelt" "$RUNNER_TEMP/out/$t" || true
            for f in "$RUNNER_TEMP/out/$t"/*; do echo "== $t $(basename "$f")"; cat "$f"; done
          done
      - name: what a child would inherit
        run: |
          uname -a
          TMPDIR="$RUNNER_TEMP" python3 notes/sh19-evidence/probe/shapes/state.py "$PWD/target/native/pelt" "$PWD/target/release/pelt" || true
