# sh18 diagnostic (never to merge): pelt's bytes in four job-control
# sessions on the macOS runner, where only presence is compared.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macdiag:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: tools/fetch-toolchain
      - run: tools/build --native
      - name: the bytes
        run: |
          for k in c_jc_fg c_jc_numbering c_jc_job_ids c_jc_ctrl_z c_jc_exit_stopped; do
            PELT_TREE=. python3 notes/sh18-evidence/probe/jcprobe.py tests/session/$k.keys $PWD/target/native/pelt -i -m || true
          done
          PELT_TREE=. python3 notes/sh18-evidence/probe/jcprobe.py notes/sh18-evidence/probe/keys/p26-fg-reader.keys $PWD/target/native/pelt -i -m || true
