# Diagnostic branch only. Never merge this workflow into trunk.
name: sh30 RSS probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  rss-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify unchanged application source and stage pinned toolchain
        run: |
          git diff --exit-code be80068 -- src tools wolf-toolchain.toml
          tools/fetch-toolchain
          tools/build --native
          git worktree add --detach ../rss-trunk 887ce12
          ln -s "$PWD/.wolf-bin" ../rss-trunk/.wolf-bin
          (cd ../rss-trunk && tools/build --native)
          uname -a
          cat /sys/kernel/mm/transparent_hugepage/enabled
          cat /sys/kernel/mm/transparent_hugepage/defrag
      - name: Colour exact whole-shape gate
        run: tools/shape-rss target/native/pelt
      - name: Trunk exact whole-shape gate
        if: always()
        run: cd ../rss-trunk && tools/shape-rss target/native/pelt
      - name: Repeated peak pairs, unchanged bounds
        if: always()
        run: python3 notes/sh30/rss-probe.py repeat
      - name: Live RSS and anonymous components, default and child-only THP disabled
        if: always()
        run: python3 notes/sh30/rss-probe.py live
      - name: One-process RSS series every ten thousand turns
        if: always()
        run: python3 notes/sh30/rss-probe.py series
