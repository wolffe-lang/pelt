aarch64-apple-darwin = "66dc74d8712bf1b8b27f2d7e9ab9038a0187085c275ff59879d241ce37e5b792"
x86_64-unknown-linux-gnu = "f5194b74879c45ad96484566950b4ae59fe1faa7ccd86461c6656f9e662b698f"
aarch64-unknown-linux-gnu = "ac612122681136eeb9e4b64d42ae83859df1cf7e8af75308e746566a181adbe6"

[std]
# The tree is pinned by commit: git's object hash is the digest. From
# 0.2.27 to 0.2.28 this was the commit the wolf archive bundles as
# `std/`; at 0.2.29 it is wolf-std's own 0.2.29 pin (the header says
# why).
repo = "wolffe-lang/wolf-std"
rev = "9e5bd6b16beeab1708a95c75d43b9926dd95f31e"
