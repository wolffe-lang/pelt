repo = "wolffe-lang/wolf-interp"
rev = "7896eddc17fd9e3e015b025b354ccf62a766734b"
version_line = "lupin 0.1.53 (wolf-interp, reference interpreter at pin 294d626)"
aarch64-apple-darwin = "997b71a5b44a5799becb954b0a287e184f322fbe02d54f319e6b439a75c4f219"
x86_64-unknown-linux-gnu = "5db5533236578008625885c7e3ed0a21084b8fa064219808ae668dedb0edccaa"
aarch64-unknown-linux-gnu = "7874ec272a2c11d2295dbeb1c12344c7ea0d081a61f9a1087467b86473526ef1"

[std]
# The tree is pinned by commit: git's object hash is the digest. From
# 0.2.27 to 0.2.28, and again from 0.2.30, this is the commit the wolf
# archive bundles as `std/`; at 0.2.29 it was wolf-std's own 0.2.29 pin
# (the header says why).
repo = "wolffe-lang/wolf-std"
rev = "fd6bcdcb1dfe03ea5092f10316b7abe81f2df41e"
