# pelt — the pinned toolchain.
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256
# digest, never from a source build: the shape boreutils pins with.
# `tools/fetch-toolchain` downloads the archive for this host, refuses
# on a digest mismatch, and stages the whole archive into `.wolf-bin/`
# (gitignored) — the native tier needs `libwolf_rt.a` beside the driver.
#
# Identity is the FIRST line of `--version`: `tools/lib-toolchain.sh`
# refuses when it drifts from `version_line`. `rev` is information: the
# commit the tag names.
#
# One row per host target pelt is built on. Windows is out of scope
# (a POSIX shell), so its archive is not pinned.
#
# ## The first pin: 0.2.24 / 0.1.47 (sh01, 2026-10-06)
#
# Digests read from the release pages (wolf-lang release 404332628,
# wolf-interp release 404283632) and re-hashed after download on
# kasumi for the linux x86-64 pair. wolf-std trunk is `2f389a7`, which
# ws51 found builds byte-identical to `14f0ab2` at 0.2.24; pelt imports
# no std module at this pin, so the tree is staged for `wolf test` and
# for the lanes that will.
#
# ## The second pin: 0.2.26 / 0.1.49 (sh03, 2026-10-09)
#
# Digests read from the release API (wolf-lang release 408143286,
# wolf-interp release 408028965) and re-hashed after download on
# kasumi for all six archives. 0.2.26 is the release that carries
# s215's descriptor builtins (os_spawn_fds, os_pipe, os_chdir,
# os_isatty), s200's bytes on descriptors 0..2 and s216's
# `copy region`: pelt H2. The std tree stays at 2f389a7, which builds
# pelt clean at 0.2.26. It is NOT inert, whatever the first pin's note
# below says: pelt imports no std module by name, but `Map.keys` and
# `Map.has` resolve to `std.map` ([type.method.root]), so without the
# tree the build is E0301 (sh03 measured it). wolf-std's own 0.2.26
# bump (sc57) is in flight.
#
# ## The third pin: 0.2.27 / 0.1.50 (sh05, 2026-10-11)
#
# Digests read from the release API (wolf-lang release 409367590,
# wolf-interp release 409303515) and re-hashed after download on
# kasumi for all six archives. 0.2.27 carries s225's `os_exec` and
# `env_unset` and s219's signal dispositions, poll, `os_proc_pid` and
# `os_wait_status`: `exec`, `unset`, `trap` and Ctrl-C. It is also the
# first archive that ships a `std/` beside `wolf` (wolf-std 87ba162,
# `std/STD-REV`). pelt still stages its own pin, because PAX builds
# pelt from this file's `[std]` rev (`pax/tools/mkpelt`), and
# `tools/fetch-toolchain` removes the archive's `.wolf-bin/std` first
# so the staged tree is one commit's, never a mix. The pin moves to
# the commit the archive bundles.

[wolf]
version = "0.2.27"
repo = "wolffe-lang/wolf-lang"
rev = "0ddda6b7ab9f899aeeea13a66b3427f8422b8a0f"
version_line = "wolf 0.2.27 (wolfgang, pin 0ddda6b)"
aarch64-apple-darwin = "ea461a7668d98604493c2af49ed931f999d702dc70f163c40bac2ec5479e5c1c"
x86_64-unknown-linux-gnu = "5e17eebed7ffbb3ee10bc669c653145903db7f591f250a096f791e4e6f377001"
aarch64-unknown-linux-gnu = "c475e5dc0a3748d15ae64096d6a33d52a67f0d879f30a4a11d40e72dfea955f7"

[lupin]
# The reference interpreter wolf 0.2.27 declares as its pairing:
# `wolf --version` line 2 reads "paired with lupin 0.1.50 (reference
# interpreter), pin 294d626".
version = "0.1.50"
repo = "wolffe-lang/wolf-interp"
rev = "32b970da7f3a50e0b82825985a39b52b74da59dc"
version_line = "lupin 0.1.50 (wolf-interp, reference interpreter at pin 294d626)"
aarch64-apple-darwin = "2cbd192d2f4fa8b994489196ad5f94ccc72c5d21d5dfe5b812045513feae626d"
x86_64-unknown-linux-gnu = "e2867a3515d4691f073f9ef30f4fe3e0fc6201f280bf24e87a42ce66562f1d93"
aarch64-unknown-linux-gnu = "a0c0c7071f0a27796fdb89d099a6e655f27f93dd208dfb493c847b6c7eb84d31"

[std]
# The tree is pinned by commit: git's object hash is the digest. Since
# 0.2.27 this is the commit the wolf archive bundles as `std/`.
repo = "wolffe-lang/wolf-std"
rev = "87ba16208da8ea642dd463fa89ff3a1ec80ceba1"
